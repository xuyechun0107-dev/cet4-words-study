services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://cet4:${MYSQL_PASSWORD}@db:3306/cet4?charset=utf8mb4
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ALLOWED_ORIGINS: https://enplay.aoke.ltd,https://enplay.ningboaoke.com,https://cet4-words-study.pages.dev
      ALLOWED_HOSTS: api-enplay.aoke.ltd,api-enplay.ningboaoke.com,localhost,127.0.0.1
      ENABLE_DOCS: "false"
      MAX_BODY_BYTES: "5242880"
      REDIS_URL: redis://redis:6379/0
      PRESENCE_CAPACITY: "200"
      PRESENCE_TTL_SECONDS: "90"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./audio:/app/audio:ro
    ports:
      - "127.0.0.1:28100:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - cet4_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cet4
      MYSQL_USER: cet4
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - cet4_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cet4", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cet4_mysql_data:
  cet4_redis_data:
